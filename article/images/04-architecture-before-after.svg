<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350"><style>
text{font-family:'Source Sans 3','Segoe UI',sans-serif;font-size:13px;fill:#17212b}
.sm{font-size:11.5px;fill:#566575}
.mono{font-family:'JetBrains Mono',Menlo,monospace;font-size:11px}
.b{font-weight:700}
.h{font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-weight:700}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.4px}
.bg{fill:#ffffff}
.box{fill:#ffffff;stroke:#d3dbe3;stroke-width:1.5}
.cbox{fill:#fbead6;stroke:#c46a12;stroke-width:1.5}
.obox{fill:#dce9f7;stroke:#1c5fa8;stroke-width:1.5}
.arr{stroke:#566575;stroke-width:1.6;fill:none}
.arr-o{stroke:#1c5fa8;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:6 4}
.c{fill:#c46a12} .o{fill:#1c5fa8} .w{fill:#ffffff}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566575"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c5fa8"/></marker>
</defs>
<rect width="800" height="350" class="bg"/>
<text x="30" y="26" class="lbl c">BEFORE · PROTOTYPE</text>
<rect x="30" y="40" width="260" height="280" rx="12" class="box dash"/>
<text x="160" y="64" text-anchor="middle" class="sm">your laptop (one process)</text>
<rect x="55" y="82" width="210" height="50" rx="8" class="cbox"/><text x="160" y="112" text-anchor="middle">Python agent</text>
<rect x="55" y="160" width="210" height="58" rx="8" class="cbox"/><text x="160" y="184" text-anchor="middle" class="b">Chroma</text><text x="160" y="203" text-anchor="middle" class="sm">+ local embedding model</text>
<rect x="55" y="246" width="210" height="50" rx="8" class="box"/><text x="160" y="276" text-anchor="middle" class="mono">./chroma_db/</text>
<path d="M160 132 V156" class="arr" marker-end="url(#ah)"/><path d="M160 218 V242" class="arr" marker-end="url(#ah)"/>

<text x="320" y="26" class="lbl o">AFTER · PRODUCTION ON AWS</text>
<rect x="320" y="40" width="450" height="280" rx="12" class="box"/>
<rect x="340" y="60" width="180" height="50" rx="8" class="cbox"/><text x="430" y="82" text-anchor="middle">Agent</text><text x="430" y="99" text-anchor="middle" class="sm">Lambda / ECS</text>
<rect x="340" y="150" width="180" height="50" rx="8" class="box"/><text x="430" y="172" text-anchor="middle">Amazon Bedrock</text><text x="430" y="189" text-anchor="middle" class="sm">embeddings + LLM</text>
<rect x="340" y="240" width="180" height="58" rx="8" class="box"/><text x="430" y="263" text-anchor="middle">IAM</text><text x="430" y="281" text-anchor="middle" class="sm">every request signed (SigV4)</text>
<rect x="570" y="60" width="180" height="150" rx="8" class="obox"/><text x="660" y="84" text-anchor="middle" class="b">OpenSearch</text><text x="660" y="101" text-anchor="middle" class="sm">index "docs"</text><text x="660" y="117" text-anchor="middle" class="sm">vector + text fields</text>
<rect x="590" y="140" width="140" height="52" rx="6" class="box"/><text x="660" y="162" text-anchor="middle" class="sm">Dashboards</text><text x="660" y="179" text-anchor="middle" class="sm">CloudWatch</text>
<rect x="570" y="248" width="180" height="50" rx="8" class="box"/><text x="660" y="270" text-anchor="middle">Amazon S3</text><text x="660" y="287" text-anchor="middle" class="sm">source documents</text>
<path d="M520 85 H566" class="arr" marker-end="url(#ah)"/><text x="525" y="78" class="sm">HTTPS</text>
<path d="M430 110 V146" class="arr" marker-end="url(#ah)"/>
<path d="M660 248 V214" class="arr" marker-end="url(#ah)"/><text x="667" y="236" class="sm">ingestion</text>
</svg>